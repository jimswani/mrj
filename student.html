<style>
/* MR-J student portal — "the student's badge": an ID card up top (pixel code like a robot's screen), then next exam, then grades / reports / attendance.
   Brand: MR-J night room — navy, lamp orange, screen teal. */
:root{
  --bg:#081219;--s1:#0f202a;--s2:#15303c;--edge:rgba(255,255,255,.09);--edge2:rgba(255,255,255,.16);
  --ink:#eef4f6;--muted:#90a7b1;--dim:#5f7884;
  --acc:#ff8a1f;--acc2:#ffc040;--holo:#3ee6d2;--ok:#4ad6a4;--warn:#ffb44d;--bad:#ff7c66;
  --chrome:linear-gradient(180deg,#fff1cf 0%,#ffc24a 38%,#ff8a1f 62%,#b8480f 100%);
  --brand:"Jersey 10","Arial Narrow",sans-serif;--px:"VT323","Courier New",monospace;--body:"Almarai","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--body);
  background-image:radial-gradient(90% 50% at 90% -6%,rgba(255,150,60,.24),transparent 62%),radial-gradient(70% 45% at -6% 104%,rgba(62,230,210,.13),transparent 70%),radial-gradient(rgba(62,230,210,.08) 1px,transparent 1.6px);background-size:auto,auto,26px 26px;background-attachment:fixed}
button,input{font:inherit;color:inherit}
input{font-size:16px!important}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.card{background:linear-gradient(180deg,rgba(28,54,66,.62),rgba(14,30,40,.62));border:1px solid var(--edge);border-radius:22px;padding:16px;box-shadow:0 18px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.top{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;direction:ltr}
.logo svg{width:38px;height:38px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.word{font-family:var(--brand);font-weight:400;font-size:32px;line-height:1;letter-spacing:.04em;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(1.5px 0 0 rgba(62,230,210,.55)) drop-shadow(-1.5px 0 0 rgba(255,70,70,.35))}
.out{margin-inline-start:auto;border:1px solid var(--edge2);background:rgba(255,255,255,.04);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted);cursor:pointer}
/* login */
.hero{display:grid;justify-items:center;gap:6px;text-align:center;padding-top:10px}
.hero svg{width:110px;height:110px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55)) drop-shadow(0 0 24px rgba(255,138,31,.25));animation:fl 4.5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.hero .word{font-size:66px}
.hero small{color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:rgba(0,0,0,.25);border:1px solid var(--edge);border-radius:14px;padding:4px}
.seg button{border:0;background:none;height:40px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;transition:background .25s,color .25s}
.seg button[aria-pressed=true]{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#1a1007;box-shadow:0 6px 16px rgba(255,138,31,.3)}
form{display:grid;gap:12px}
label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:700}
.in{height:52px;border-radius:14px;border:1px solid var(--edge2);background:rgba(3,10,14,.55);padding:0 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,138,31,.18)}
.in.code{font-family:var(--px);font-size:30px!important;letter-spacing:.35em;text-align:center;direction:ltr}
.in.ltr{direction:ltr;text-align:center;letter-spacing:.08em}
.btn{height:52px;border:0;border-radius:16px;font-weight:800;font-size:16px;cursor:pointer;color:#1a1007;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 10px 24px rgba(255,138,31,.3),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,opacity .2s;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--ink);box-shadow:none;border:1px solid var(--edge2)}
.msg{margin:0;min-height:20px;text-align:center;font-size:14px;color:var(--warn)}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.7}
/* badge */
.badge{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border-color:rgba(255,160,70,.3)}
.badge::before{content:"";position:absolute;top:-70px;left:-50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,31,.22),transparent 65%)}
.av{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;font-size:30px;font-weight:800;color:#1a1007;background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:0 10px 24px rgba(255,138,31,.35)}
.bn{display:grid;gap:2px;min-width:0}.bn b{font-size:21px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bn small{color:var(--muted);font-size:13px}
.idc{display:inline-flex;align-items:center;gap:8px;justify-self:start;margin-top:4px;background:#05121a;border:1px solid rgba(62,230,210,.35);border-radius:10px;padding:2px 10px;font-family:var(--px);font-size:22px;color:var(--holo);letter-spacing:.2em;direction:ltr;text-shadow:0 0 10px rgba(62,230,210,.55)}
/* next exam */
.nx{display:grid;gap:12px;border-color:rgba(62,230,210,.3)}
.live{display:inline-flex;align-items:center;gap:6px;justify-self:start;font-size:12px;font-weight:800;color:var(--holo);background:rgba(62,230,210,.1);border:1px solid rgba(62,230,210,.3);border-radius:999px;padding:4px 10px}
.live i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:lp 1.8s infinite}
.live.now{color:var(--ok);background:rgba(74,214,164,.1);border-color:rgba(74,214,164,.35)}
@keyframes lp{0%{box-shadow:0 0 0 0 rgba(62,230,210,.6)}70%,100%{box-shadow:0 0 0 8px transparent}}
.nx-r{display:flex;align-items:center;gap:12px}.nx-t{display:grid;min-width:0}.nx-t b{font-size:20px}.nx-t small{color:var(--muted);font-size:13px}
.cd{margin-inline-start:auto;text-align:center;font-family:var(--px);font-size:36px;line-height:.95;color:var(--holo);text-shadow:0 0 14px rgba(62,230,210,.5);direction:ltr}
.cd small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);text-shadow:none;margin-top:4px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.st{display:grid;justify-items:center;gap:4px;text-align:center;padding:14px 8px}
.st b{font-size:24px;font-weight:800}.st small{font-size:12px;color:var(--muted)}
.bar{width:100%;height:5px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;animation:bi 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes bi{from{width:0}}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.holo{color:var(--holo)}
/* lists */
.sec{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin:4px 4px -4px}.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--edge2))}
.list{display:grid;gap:10px}
.ex{display:grid;gap:8px}
.ex-h{display:flex;align-items:center;gap:8px}.ex-h b{font-size:16px}.ex-h small{color:var(--muted);font-size:12px}
.sc{margin-inline-start:auto;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.sc small{font-size:13px;color:var(--muted);font-weight:400}
.rk{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:rgba(255,192,64,.12);color:var(--acc2);justify-self:start}
.mo{display:grid;gap:10px}
.mo-h{display:flex;align-items:center;gap:8px}.mo-h b{font-size:17px}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;margin-inline-start:auto}
.pill.ok{background:rgba(74,214,164,.12)}.pill.warn{background:rgba(255,180,77,.12)}.pill.bad{background:rgba(255,124,102,.12)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.kv span{display:grid;background:rgba(0,0,0,.2);border-radius:12px;padding:8px 4px}.kv b{font-size:17px}.kv small{font-size:11px;color:var(--muted)}
.note{margin:0;padding:10px 12px;border-radius:14px;background:rgba(255,138,31,.08);border:1px solid rgba(255,138,31,.25);font-size:14px;line-height:1.8}
.note b{color:var(--acc2);font-size:12px;display:block}
.days{display:flex;gap:6px;flex-wrap:wrap}
.dy{display:grid;justify-items:center;gap:2px;min-width:54px;padding:8px 6px;border-radius:12px;font-size:12px;background:rgba(0,0,0,.2);border:1px solid var(--edge)}
.dy b{font-size:16px}.dy.p{border-color:rgba(74,214,164,.35)}.dy.p b{color:var(--ok)}.dy.a{border-color:rgba(255,124,102,.35)}.dy.a b{color:var(--bad)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:18px}
.foot{text-align:center;font-size:12px;color:var(--dim);margin-top:6px}
.foot a{color:var(--muted)}
.load{display:flex;justify-content:center;gap:8px;padding:50px}.load i{width:10px;height:10px;border-radius:3px;background:var(--acc);animation:ld 1s infinite}.load i:nth-child(2){animation-delay:.15s;background:var(--acc2)}.load i:nth-child(3){animation-delay:.3s;background:var(--holo)}
@keyframes ld{50%{transform:translateY(-8px);opacity:.5}}
.fade{animation:fd .45s both cubic-bezier(.2,.9,.25,1)}@keyframes fd{from{opacity:0;transform:translateY(10px)}}
@media (min-width:900px){.wrap{max-width:900px;grid-template-columns:1fr 1fr;align-items:start}.wrap>.full{grid-column:1/-1}}
/* ===== login, v2 ===== */
.lg{display:grid;gap:16px;justify-items:center;max-width:420px;width:100%;margin:0 auto;padding-top:8px}
.lg-hero{display:grid;justify-items:center;gap:4px;text-align:center}
.lg-bot{position:relative;width:118px;height:118px;animation:fl 4.5s ease-in-out infinite}
.lg-bot svg{width:100%;height:100%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.55)) drop-shadow(0 0 28px rgba(255,138,31,.28))}
.lg-bot .scan{position:absolute;left:27%;right:27%;top:30%;height:3px;border-radius:3px;background:var(--holo);box-shadow:0 0 12px var(--holo);opacity:.8;animation:scan 2.6s ease-in-out infinite}
@keyframes scan{0%,100%{top:30%;opacity:0}15%,85%{opacity:.85}50%{top:62%}}
.lg-hero .word{font-size:72px}
.lg-sub{color:var(--muted);font-size:15px;font-weight:700}
.lg-card{position:relative;width:100%;display:grid;gap:16px;padding:18px;border-radius:26px;background:linear-gradient(180deg,rgba(28,54,66,.72),rgba(10,24,32,.78));border:1px solid var(--edge2);box-shadow:0 26px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.lg-card::before{content:"";position:absolute;inset:-1px;border-radius:26px;padding:1px;background:linear-gradient(140deg,rgba(255,170,80,.55),transparent 35%,transparent 65%,rgba(62,230,210,.45));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.pin{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pin input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px!important;border:0;caret-color:transparent;z-index:1}
.pin span{height:64px;border-radius:16px;display:grid;place-items:center;background:#04101a;border:1px solid var(--edge2);font-family:var(--px);font-size:40px;color:var(--holo);text-shadow:0 0 12px rgba(62,230,210,.55);transition:border-color .2s,box-shadow .2s,transform .2s}
.pin span.fill{border-color:rgba(62,230,210,.35)}
.pin span.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,138,31,.2)}
.pin span.on:empty::after{content:"";width:2px;height:28px;background:var(--acc);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lockcode{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#04101a;border:1px solid rgba(62,230,210,.3)}
.lc-l{font-size:13px;color:var(--muted);font-weight:700}
.lc-v{font-family:var(--px);font-size:34px;line-height:1;letter-spacing:.3em;color:var(--holo);text-shadow:0 0 12px rgba(62,230,210,.55);margin-inline-start:auto}
.lc-e{width:40px;height:40px;border-radius:12px;border:1px solid var(--edge2);background:rgba(255,255,255,.05);display:grid;place-items:center;cursor:pointer;flex:none}
.lc-e svg,.eye svg{width:19px;height:19px;stroke:var(--acc2);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pwf{position:relative}.pwf .in{width:100%;padding-inline-start:52px}
.eye{position:absolute;inset-inline-start:6px;top:6px;width:40px;height:40px;border:0;border-radius:12px;background:none;display:grid;place-items:center;cursor:pointer;opacity:.75}
.eye.on{opacity:1;background:rgba(255,192,64,.12)}
.btn.ld span{opacity:0}.btn.ld{position:relative}.btn.ld::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid rgba(26,16,7,.25);border-top-color:#1a1007;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.okline{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink);background:rgba(74,214,164,.1);border:1px solid rgba(74,214,164,.3);border-radius:14px;padding:10px 12px}
.okline span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ok);color:#062118;font-weight:800}
.lg-feat{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lg-feat span{font-size:12px;color:var(--muted);border:1px solid var(--edge);background:rgba(255,255,255,.03);border-radius:999px;padding:6px 12px}
.lg .foot{margin:0}
@media (min-width:900px){.lg{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
/* To copy for another teacher: change FIREBASE_CONFIG and DOMAIN (must match index.html) */
const FIREBASE_CONFIG={apiKey:"AIzaSyC_6SZm-yuApkiq5SBsGRgu5gJzkuJNZyE",authDomain:"mr-j-db42a.firebaseapp.com",projectId:"mr-j-db42a",storageBucket:"mr-j-db42a.firebasestorage.app",messagingSenderId:"82946343696",appId:"1:82946343696:web:c4c828357e43ea58cb5b95"};
const DOMAIN="mrj.app",BASE="t/main";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ar=n=>Number(n).toLocaleString("ar-EG",{maximumFractionDigits:1});
const pad=n=>String(n).padStart(2,"0");
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const DAYS=["حد","اتنين","تلات","أربع","خميس","جمعة","سبت"],WEEK=[6,0,1,2,3,4,5];
const mName=m=>{const[y,k]=m.split("-");return MONTHS[+k-1]+" "+ar(+y).replace(/٬/g,"")};
const mShort=m=>MONTHS[+m.split("-")[1]-1];
const curKey=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const timeTxt=t=>{if(!t)return"";let[h,m]=t.split(":").map(Number);const pm=h>=12;h=h%12||12;return ar(h)+(m?":"+ar(pad(m)):"")+(pm?" م":" ص")};
const dateTxt=ms=>{const d=new Date(ms);return DAYS[d.getDay()]+" "+ar(d.getDate())+"/"+ar(d.getMonth()+1)+" · "+timeTxt(pad(d.getHours())+":"+pad(d.getMinutes()))};
const ROBOT='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="8" cy="34" r="7" fill="#ff8a1f"/><circle cx="56" cy="34" r="7" fill="#ff8a1f"/><rect x="7" y="7" width="50" height="50" rx="17" fill="#f4f6f8"/><rect x="7" y="40" width="50" height="17" rx="8" fill="#d7dde2"/><rect x="11.5" y="13" width="41" height="35" rx="12" fill="#ff8a1f"/><rect x="15" y="16.5" width="34" height="28" rx="9" fill="#0a161d"/><text x="32" y="35.5" text-anchor="middle" font-size="15" font-family="VT323,monospace" fill="#3ee6d2">MR/J</text></svg>';
const LOGO=`<div class="logo">${ROBOT}<span class="word">MR-J</span></div>`;
const lsGet=k=>{try{return localStorage.getItem("mrjp_"+k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem("mrjp_"+k,v)}catch(e){}};
const phone10=p=>String(p||"").replace(/\D/g,"").slice(-10);
const normCode=c=>String(c||"").replace(/\D/g,"").slice(-4).padStart(4,"0");
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
/* own app instance → its own sign-in, separate from the teacher's app on the same phone */
const app=firebase.initializeApp(FIREBASE_CONFIG,"student"),auth=app.auth(),fs=app.firestore();
const D=p=>fs.doc(BASE+"/"+p);
const emailOf=(code,gen)=>"p"+code+"g"+(gen||0)+"@"+DOMAIN;
async function genOf(code){try{const d=await D("portalGen/"+code).get();return d.exists?Number(d.data().gen)||0:0}catch(e){return 0}}
let PUB=null,unsub=null,tab=lsGet("tab")||"grades",tick=0,mode="login",actStep=1,actData=null;
function show(h){const a=$("#app");a.innerHTML=h}
/* ---------- login / activation ---------- */
const EYE='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const PEN='<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/></svg>';
let editCode=false;
if(lsGet("code"))actStep=0;
/* a 4-cell code display driven by one hidden-in-plain-sight input */
const pinBox=(id,val)=>`<div class="pin" dir="ltr"><input id="${id}" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="username" aria-label="كودك" value="${esc(val||"")}"><span></span><span></span><span></span><span></span></div>`;
function wirePin(id){const inp=$("#"+id),cells=[...inp.parentNode.querySelectorAll("span")];
  const up=()=>{inp.value=inp.value.replace(/\D/g,"").slice(0,4);const v=inp.value,f=document.activeElement===inp;cells.forEach((c,k)=>{c.textContent=v[k]||"";c.classList.toggle("on",f&&k===Math.min(v.length,3));c.classList.toggle("fill",!!v[k])})};
  ["input","focus","blur"].forEach(ev=>inp.addEventListener(ev,up));up()}
const pwBox=(id,ac,ph)=>`<div class="pwf"><input class="in ltr" id="${id}" type="password" autocomplete="${ac}" placeholder="${ph||"••••••"}"><button type="button" class="eye" data-eye="${id}" aria-label="اظهر الباسورد">${EYE}</button></div>`;
document.addEventListener("click",e=>{const b=e.target.closest("[data-eye]");if(!b)return;const i=$("#"+b.dataset.eye);i.type=i.type==="password"?"text":"password";b.classList.toggle("on",i.type==="text");i.focus()});
function loginView(msg){mode="login";const sc=lsGet("code"),nm=lsGet("name");
  show(`<div class="lg full">
    <div class="lg-hero fade"><div class="lg-bot">${ROBOT}<i class="scan"></i></div><span class="word">MR-J</span><span class="lg-sub">${sc&&actStep===0&&!editCode?`أهلاً تاني${nm?" يا "+esc(nm):""} 👋`:"منصة الطالب"}</span></div>
    <div class="lg-card fade">
      <div class="seg" id="lTab"><button type="button" data-t="in" aria-pressed="${actStep===0}">دخول</button><button type="button" data-t="act" aria-pressed="${actStep!==0}">أول مرة؟ فعّل حسابك</button></div>
      <div id="lBody"></div>
      <p class="msg" id="lMsg" role="alert">${esc(msg||"")}</p>
    </div>
    <div class="lg-feat fade"><span>📝 امتحاناتك</span><span>📊 درجاتك وترتيبك</span><span>🗓️ حضورك وتقاريرك</span></div>
    <p class="foot">نسيت الباسورد؟ كلّم Mr J يمسحه وتفعّل حسابك من جديد.</p></div>`);
  $("#lTab").onclick=e=>{const b=e.target.closest("button");if(!b)return;actStep=b.dataset.t==="in"?0:1;actData=null;loginView()};
  drawLogin()}
function drawLogin(){const B=$("#lBody"),sc=lsGet("code");
  if(actStep===0){const fixed=sc&&!editCode;
    B.innerHTML=`<form id="fIn" autocomplete="on">
      ${fixed?`<div class="lockcode"><span class="lc-l">كودك</span><span class="lc-v" dir="ltr">${esc(sc)}</span><button type="button" class="lc-e" id="editCode" aria-label="غيّر الكود">${PEN}</button><input type="hidden" id="iCode" value="${esc(sc)}" autocomplete="username"></div>`
        :`<label>كودك${pinBox("iCode",sc||"")}</label>`}
      <label>الباسورد${pwBox("iPw","current-password")}</label>
      <button class="btn" id="bIn"><span>ادخل</span></button></form>`;
    if(fixed){$("#editCode").onclick=()=>{editCode=true;drawLogin();$("#iCode").focus();$("#iCode").select()};setTimeout(()=>$("#iPw").focus(),350)}else wirePin("iCode");
    $("#fIn").onsubmit=async e=>{e.preventDefault();const raw=$("#iCode").value.trim(),code=normCode(raw),pw=$("#iPw").value;if(raw.length<1){err("اكتب كودك");return}if(!pw){err("اكتب الباسورد");$("#iPw").focus();return}
      busy("#bIn",1);try{const g=await genOf(code);await auth.signInWithEmailAndPassword(emailOf(code,g),pw);lsSet("code",code);editCode=false}catch(x){err(aErr(x,"الكود أو الباسورد غلط"));busy("#bIn",0)}};return}
  if(actStep===1){B.innerHTML=`<p class="hint">اكتب كودك اللي Mr J بعتهولك، ورقم ولي أمرك المتسجّل عنده. ده مرة واحدة بس.</p>
    <form id="fA"><label>كودك${pinBox("aCode",sc||"")}</label>
    <label>رقم ولي الأمر<input class="in ltr" id="aPh" type="tel" inputmode="tel" placeholder="01xxxxxxxxx"></label><button class="btn" id="bA"><span>كمّل</span></button></form>`;
    wirePin("aCode");
    $("#fA").onsubmit=async e=>{e.preventDefault();const raw=$("#aCode").value.trim(),code=normCode(raw),ph=phone10($("#aPh").value);if(!raw){err("اكتب كودك");return}if(ph.length<10){err("اكتب رقم ولي الأمر كامل");return}
      busy("#bA",1);try{const h=await sha("mrj-portal|"+code+"|"+ph),k=await D("portalKeys/"+h).get();if(!k.exists){err("الكود أو رقم ولي الأمر مش مظبوطين. اتأكد منهم أو كلّم Mr J");busy("#bA",0);return}
        actData={code,h,sid:k.data().sid};actStep=2;drawLogin();err("")}catch(x){err(aErr(x,"حصلت مشكلة، جرّب تاني"));busy("#bA",0)}};return}
  B.innerHTML=`<div class="okline"><span>✓</span>اتأكدنا منك. اختار باسورد ليك، ٦ حروف أو أرقام على الأقل.</div>
    <form id="fP"><div class="lockcode"><span class="lc-l">كودك</span><span class="lc-v" dir="ltr">${esc(actData.code)}</span></div>
    <label>الباسورد${pwBox("p1","new-password")}</label><label>اكتبه تاني${pwBox("p2","new-password")}</label><button class="btn" id="bP"><span>فعّل حسابي</span></button></form>`;
  setTimeout(()=>$("#p1").focus(),300);
  $("#fP").onsubmit=async e=>{e.preventDefault();const p1=$("#p1").value,p2=$("#p2").value;if(p1.length<6){err("الباسورد لازم ٦ حروف أو أرقام على الأقل");return}if(p1!==p2){err("الباسوردين مش زي بعض");return}
    busy("#bP",1);
    try{const g=await genOf(actData.code);let cred;
      try{cred=await auth.createUserWithEmailAndPassword(emailOf(actData.code,g),p1)}
      catch(x){if(!(x&&x.code==="auth/email-already-in-use"))throw x;
        /* an earlier try made the account but didn't finish linking it: same password → finish now */
        try{cred=await auth.signInWithEmailAndPassword(emailOf(actData.code,g),p1);const l=await D("portal/"+cred.user.uid).get();if(l.exists){lsSet("code",actData.code);actStep=0;start(cred.user);return}}
        catch(y){err("الحساب ده متفعّل قبل كده. ادخل من «دخول»، ولو نسيت الباسورد كلّم Mr J");busy("#bP",0);return}}
      await D("portal/"+cred.user.uid).set({sid:actData.sid,code:actData.code,h:actData.h,pw:p1,at:firebase.firestore.FieldValue.serverTimestamp()});
      lsSet("code",actData.code);actStep=0;start(cred.user)}
    catch(x){err(aErr(x,"ماتفعّلش، جرّب تاني"));busy("#bP",0)}}}
function aErr(x,d){const c=x&&x.code||"";console.warn(x);if(c.includes("permission-denied"))return"المنصة لسه مقفولة من Firebase. قول لـ Mr J (كود P1)";if(c.includes("unavailable"))return"مش قادر أوصل للسيرفر. جرّب تاني بعد شوية (كود U1)";if(c.includes("network"))return"مفيش نت. اتأكد من النت وجرّب تاني";if(c.includes("too-many"))return"جربت كتير. استنى دقيقة وجرّب تاني";if(c.includes("weak-password"))return"الباسورد ضعيف، خليه ٦ على الأقل";return d+(c&&!/invalid|wrong-password|user-not-found/.test(c)?" ("+c.replace(/^(auth|firestore)\//,"")+")":"")}
function err(m){const e=$("#lMsg");if(e)e.textContent=m}
function busy(s,on){const b=$(s);if(b){b.disabled=!!on;b.classList.toggle("ld",!!on)}}
/* ---------- signed in ---------- */
let started=false;
async function start(u){if(started)return;started=true;show(`<div class="load full"><i></i><i></i><i></i></div>`);
  try{const l=await D("portal/"+u.uid).get();if(!l.exists){await auth.signOut();started=false;actStep=1;loginView("الباسورد ده اتمسح. فعّل حسابك تاني بكودك ورقم ولي الأمر");return}
    const sid=l.data().sid;unsub=D("pub/"+sid).onSnapshot(d=>{PUB=d.exists?d.data():null;if(PUB&&PUB.months)Object.values(PUB.months).forEach(M=>{M.ss=(M.ss||[]).map(x=>Array.isArray(x)?{d:x[0],k:x[1]}:x);M.ex=M.ex||[]});if(PUB&&PUB.name)lsSet("name",String(PUB.name).split(" ")[0]);draw()},()=>{show(`<div class="card full empty">مش قادر أجيب بياناتك دلوقتي. جرّب تاني بعد شوية.</div>`)})}
  catch(x){started=false;loginView("مفيش نت. جرّب تاني")}}
auth.onAuthStateChanged(u=>{if(u)start(u);else if(!started)loginView()});
function signOut(){if(unsub)unsub();unsub=null;started=false;PUB=null;auth.signOut()}
/* ---------- dashboard ---------- */
function draw(){if(mode!=="dash"){mode="dash"}
  const P=PUB;if(!P){show(`<div class="top full">${LOGO}<button class="out" id="bOut">خروج</button></div><div class="card full empty">بياناتك لسه بتتجهّز. Mr J هيحدّثها قريب، ارجعلها بعد شوية.</div>`);$("#bOut").onclick=signOut;return}
  const ms=Object.keys(P.months||{}).sort().reverse(),cur=curKey(),M=(P.months||{})[cur]||(P.months||{})[ms[0]]||null,mk=(P.months||{})[cur]?cur:ms[0];
  let h=`<div class="top full">${LOGO}<button class="out" id="bOut">خروج</button></div>`;
  const g=P.g;h+=`<div class="card badge full fade"><span class="av">${esc((P.name||"؟")[0])}</span><div class="bn"><b>${esc(P.name)}</b><small>${g?esc(g.n)+" · "+(g.y==="1"?"أولى":"تانية")+" ثانوي"+(g.d&&g.d.length?" · "+WEEK.filter(d=>g.d.includes(d)).map(d=>DAYS[d]).join(" و")+(g.t?" "+timeTxt(g.t):""):""):""}</small><span class="idc">${esc(P.code)}</span></div></div>`;
  h+=nextExamHTML(P);
  if(M){const n=M.ss.length,pp=M.ss.filter(x=>x.k==="p").length,ap=n?Math.round(pp/n*100):null,gs=M.ex,gp=gs.length?Math.round(gs.reduce((a,e)=>a+e.sc,0)/gs.reduce((a,e)=>a+e.of,0)*100):null,rem=Math.max(M.fee-M.amt,0);
    h+=`<div class="sec full">${esc(mName(mk))}</div><div class="stats full">
      <div class="card st"><b class="holo">${ap==null?"—":ar(ap)+"٪"}</b><small>الحضور${n?` · ${ar(pp)} من ${ar(n)}`:""}</small><span class="bar"><i style="width:${ap||0}%;background:var(--holo)"></i></span></div>
      <div class="card st"><b style="color:var(--acc2)">${gp==null?"—":ar(gp)+"٪"}</b><small>الدرجات</small><span class="bar"><i style="width:${gp||0}%;background:var(--acc2)"></i></span></div>
      <div class="card st"><b class="${M.paid||(!rem&&M.fee)?"ok":M.amt?"warn":"bad"}">${M.paid||(!rem&&M.fee)?"✓":M.amt?ar(rem):"لسه"}</b><small>${M.paid||(!rem&&M.fee)?"دفعت الشهر":M.amt?"باقي عليك ج":"مدفعتش الشهر"}</small><span class="bar"><i style="width:${M.fee?Math.min(100,Math.round(M.amt/M.fee*100)):0}%;background:var(--ok)"></i></span></div></div>`}
  h+=`<div class="seg full" id="tabs"><button type="button" data-t="grades" aria-pressed="${tab==="grades"}">درجاتي</button><button type="button" data-t="reps" aria-pressed="${tab==="reps"}">تقاريري</button><button type="button" data-t="att" aria-pressed="${tab==="att"}">حضوري</button></div>`;
  h+=`<div class="full list fade" id="tabBody">${tabHTML(P,ms)}</div>`;
  h+=`<p class="foot full">${esc(P.tch&&P.tch.n||"")} · ${esc(P.tch&&P.tch.s||"")} · <a href="https://wa.me/20${esc(String(P.tch&&P.tch.p||"").replace(/\D/g,"").replace(/^20/,"").replace(/^0/,""))}" target="_blank" rel="noopener">${esc(P.tch&&P.tch.p||"")}</a></p>`;
  show(h);$("#bOut").onclick=signOut;
  $("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;lsSet("tab",tab);document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));const t=$("#tabBody");t.innerHTML=tabHTML(PUB,Object.keys(PUB.months||{}).sort().reverse());t.classList.remove("fade");void t.offsetWidth;t.classList.add("fade")};
  clearInterval(tick);tick=setInterval(()=>{const c=$("#nxBox");if(c)c.outerHTML=nextExamHTML(PUB)},30000)}
function nextExamHTML(P){const now=Date.now(),L=(P.exams||[]).filter(e=>e.c>now).sort((a,b)=>a.o-b.o),e=L[0];if(!e)return`<div id="nxBox" hidden></div>`;
  const open=now>=e.o,left=open?e.c-now:e.o-now,mins=Math.floor(left/60000),cd=!open&&mins<1440?pad(Math.floor(mins/60))+":"+pad(mins%60):"";
  const url="exam.html?e="+encodeURIComponent(e.id)+"&c="+encodeURIComponent(P.code);
  return `<div class="card nx full fade" id="nxBox"><span class="live${open?" now":""}"><i></i>${open?"الامتحان مفتوح دلوقتي":"امتحانك الجاي"}</span>
    <div class="nx-r"><div class="nx-t"><b>${esc(e.t)}</b><small>${open?"بيقفل "+esc(dateTxt(e.c)):"بيفتح "+esc(dateTxt(e.o))} · ⏱ ${ar(e.d)} دقيقة${e.q?" · "+ar(e.q)+" سؤال":""}</small></div>${cd?`<div class="cd">${cd}<small>ساعة : دقيقة</small></div>`:""}</div>
    ${open?`<a class="btn" href="${url}">ادخل الامتحان</a><p class="hint">هتحتاج «كود الامتحان» اللي اتبعت لولي أمرك، خليه جنبك وانت بتحل.</p>`:`<p class="hint">يوم الامتحان افتح المنصة وهتلاقي زرار الدخول هنا. هتحتاج «كود الامتحان» اللي هيتبعت لولي أمرك.</p>`}
    ${L.length>1?`<p class="hint">وبعده: ${L.slice(1,3).map(x=>esc(x.t)+" ("+esc(dateTxt(x.o))+")").join(" · ")}</p>`:""}</div>`}
function tabHTML(P,ms){
  if(tab==="grades"){const rows=[];ms.forEach(m=>(P.months[m].ex||[]).forEach(e=>rows.push({m,...e})));
    const done=(P.exams||[]).filter(e=>e.pub);
    if(!rows.length&&!done.length)return`<div class="card empty">لسه مفيش درجات. أول ما Mr J يسجّل درجة امتحان هتلاقيها هنا.</div>`;
    return rows.map(e=>{const p=Math.round(e.sc/e.of*100),c=p>=85?"ok":p>=60?"warn":"bad";return `<div class="card ex"><div class="ex-h"><div><b>${esc(e.n)}</b><br><small>${esc(mName(e.m))}</small></div><span class="sc ${c}">${ar(e.sc)}<small>/${ar(e.of)}</small></span></div>
      <span class="bar"><i style="width:${p}%;background:var(--${c==="ok"?"ok":c==="warn"?"acc2":"bad"})"></i></span>${e.cnt>1?`<span class="rk">${e.rk===1?"🥇 الأول":"ترتيبك "+ar(e.rk)} من ${ar(e.cnt)}${e.top&&e.rk!==1?" · أعلى درجة "+ar(e.top):""}</span>`:""}</div>`}).join("")
      +(done.length?`<div class="sec">امتحانات أونلاين اتصححت</div>`+done.map(e=>`<a class="card ex" style="text-decoration:none;color:inherit" href="exam.html?e=${encodeURIComponent(e.id)}&c=${encodeURIComponent(P.code)}"><div class="ex-h"><b>${esc(e.t)}</b><small style="margin-inline-start:auto">شوف ورقتك ‹</small></div></a>`).join(""):"")}
  if(tab==="reps"){if(!ms.length)return`<div class="card empty">لسه مفيش تقارير.</div>`;
    return ms.map(m=>{const M=P.months[m],n=M.ss.length,pp=M.ss.filter(x=>x.k==="p").length,ap=n?Math.round(pp/n*100):null,gp=M.ex.length?Math.round(M.ex.reduce((a,e)=>a+e.sc,0)/M.ex.reduce((a,e)=>a+e.of,0)*100):null,rem=Math.max(M.fee-M.amt,0),paid=M.paid||(!rem&&M.fee);
      const verdict=gp==null&&ap==null?"":gp!=null&&gp>=85&&(ap==null||ap>=85)?"شهر ممتاز، كمّل كده 👏":gp!=null&&gp<60?"محتاج تذاكر أكتر الشهر الجاي، وانت قدها 💪":ap!=null&&ap<75?"الغياب أثّر عليك، حاول متغيبش الشهر الجاي":"شغل كويس، وتقدر توصل للأحسن ⭐";
      return `<div class="card mo"><div class="mo-h"><b>${esc(mName(m))}</b><span class="pill ${paid?"ok":M.amt?"warn":"bad"}">${paid?"دفع ✓":M.amt?"باقي "+ar(rem)+" ج":"لسه مدفعش"}</span></div>
        <div class="kv"><span><b class="holo">${ap==null?"—":ar(ap)+"٪"}</b><small>حضور</small></span><span><b style="color:var(--acc2)">${gp==null?"—":ar(gp)+"٪"}</b><small>درجات</small></span><span><b>${ar(M.ex.length)}</b><small>امتحانات</small></span></div>
        ${verdict?`<p class="hint">${verdict}</p>`:""}${M.note?`<p class="note"><b>ملاحظة Mr J</b>${esc(M.note)}</p>`:""}</div>`}).join("")}
  if(!ms.length)return`<div class="card empty">لسه مفيش حصص متسجلة.</div>`;
  return ms.map(m=>{const M=P.months[m],rem=Math.max(M.fee-M.amt,0),paid=M.paid||(!rem&&M.fee);
    return `<div class="card mo"><div class="mo-h"><b>${esc(mName(m))}</b><span class="pill ${paid?"ok":M.amt?"warn":"bad"}">${paid?"دفعت "+ar(M.amt||M.fee)+" ج":M.amt?"دفعت "+ar(M.amt)+" · باقي "+ar(rem):"لسه · "+ar(M.fee)+" ج"}</span></div>
      ${M.ss.length?`<div class="days">${M.ss.map(({d,k})=>{const x=new Date(d+"T12:00");return `<span class="dy ${k}"><b>${k==="p"?"✓":"✗"}</b>${DAYS[x.getDay()]} ${ar(x.getDate())}</span>`}).join("")}</div>`:`<p class="hint">مفيش حصص متسجلة الشهر ده.</p>`}</div>`}).join("")}
</script>
</body>
